# ReasonKE++ PPO Training Configuration Example
# This is an example configuration for PPO training with verl

# Data configuration
data:
  train_files: /path/to/train.parquet
  val_files: /path/to/test.parquet
  train_batch_size: 2048
  max_prompt_length: 512
  max_response_length: 512

# Custom reward function
custom_reward_function:
  path: ppo_training/reward_function.py
  name: compute_score

# Actor, Rollout, and Reference model configuration
actor_rollout_ref:
  model:
    path: /path/to/sft/model
  
  # Actor (policy) configuration
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 512
    ppo_micro_batch_size_per_gpu: 4
  
  # Rollout (generation) configuration
  rollout:
    name: vllm  # Use vLLM for fast generation
    log_prob_micro_batch_size_per_gpu: 8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
  
  # Reference model configuration
  ref:
    log_prob_micro_batch_size_per_gpu: 4

# Critic (value function) configuration
critic:
  optim:
    lr: 1e-5
  model:
    path: /path/to/sft/model
  ppo_micro_batch_size_per_gpu: 4

# PPO algorithm configuration
algorithm:
  kl_ctrl:
    kl_coef: 0.001  # KL divergence coefficient

# Trainer configuration
trainer:
  logger: console  # Options: console, wandb, tensorboard
  project_name: reasonke
  experiment_name: ppo_training
  val_before_train: False
  resume_mode: disable  # Options: disable, must, allow
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 100  # Save checkpoint every N steps
  test_freq: 10   # Evaluate every N steps
  total_epochs: 15

